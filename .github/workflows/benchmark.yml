name: Benchmark nf:solve

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      nforma_ref:
        description: 'nForma ref to benchmark (branch, tag, or SHA)'
        required: false
        default: 'main'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM UTC

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout nf-benchmark
        uses: actions/checkout@v4
        with:
          repository: 'nForma-AI/nf-benchmark'
          path: 'nf-benchmark'

      - name: Checkout nForma (QGSD)
        uses: actions/checkout@v4
        with:
          repository: 'nForma-AI/nForma'
          ref: ${{ inputs.nforma_ref || 'main' }}
          path: 'nforma'
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nf-benchmark/package-lock.json

      - name: Install dependencies
        working-directory: nf-benchmark
        run: npm ci

      # On main branch (or weekly): restore any existing baseline then save a new one
      - name: Restore baseline cache (main)
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: nf-benchmark/baseline.json
          key: benchmark-baseline-main-${{ github.sha }}
          restore-keys: |
            benchmark-baseline-main-

      # On PRs: restore the main branch baseline so we can compare against it
      - name: Restore baseline cache (PR)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: nf-benchmark/baseline.json
          key: benchmark-baseline-main-
          restore-keys: |
            benchmark-baseline-main-

      # Main / nightly run: run all challenges and save as new baseline
      - name: Run benchmark (main — save baseline)
        if: github.event_name != 'pull_request'
        working-directory: nf-benchmark
        run: |
          node bin/nf-benchmark.cjs run \
            --project-root ../nforma \
            --timeout 600 \
            --save-baseline
        env:
          CI: true

      # PR run: compare against main baseline — INFORMATIONAL ONLY.
      # This legacy job runs a non-deterministic LLM solver against a coupled
      # ../nforma checkout and compares to a GitHub-cache baseline with a hardcoded
      # zero-tolerance per-category gate. The "stability"/null-mutation category is
      # structurally flaky because nf-solve is not idempotent on no-op runs (it
      # rewrites .planning/formal/solve-state.json, so residual drifts 348→340
      # between the two identical runs) — see follow-up issue. As a result this gate
      # would flag a phantom regression on essentially every PR regardless of content
      # (today's main scores stability 0/15 too). The real PR gate is now the
      # deterministic, decoupled "Fixture corpus vs npm SUT" job. We keep this job
      # for trend data but mark it continue-on-error so it never blocks a merge.
      - name: Run benchmark (PR — compare baseline)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: nf-benchmark
        run: |
          COMPARE_FLAG=""
          if [ -f baseline.json ]; then
            COMPARE_FLAG="--compare-baseline --baseline-tolerance 0"
          else
            echo "No baseline found — running without comparison (first run on this repo?)"
          fi

          node bin/nf-benchmark.cjs run \
            --project-root ../nforma \
            --timeout 600 \
            $COMPARE_FLAG
        env:
          CI: true

      # Save the newly generated baseline so PRs can compare against it
      - name: Save baseline cache (main)
        if: github.event_name != 'pull_request' && success()
        uses: actions/cache/save@v4
        with:
          path: nf-benchmark/baseline.json
          key: benchmark-baseline-main-${{ github.sha }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            nf-benchmark/results/
            nf-benchmark/baseline.json
          retention-days: 30
